# Lint scripts/ with the package's rules (python/pyproject.toml), plus what
# command-line tools need.
extend = "../python/pyproject.toml"
src = ["."]

[lint]
extend-ignore = [
  "T201",    # print: these are CLI tools that report on stdout
  "S101",    # assert: type narrowing only; scripts never run with -O
  "PTH123",  # open(): plain file writes are clearer here
]

[lint.per-file-ignores]
# Runs only inside the bittensor==10.5.0 venv (legacy_venv.sh), on purpose.
"capture_v10_vectors.py" = ["TID251"]
