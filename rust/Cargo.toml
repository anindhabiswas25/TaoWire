[package]
name = "taowire-btauth"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "ALPHA, not security-reviewed, not for mainnet value: btauth/1 signed requests and twresp/1 signed responses for Bittensor v11 subnets (TaoWire)"
readme = "README.md"
repository = "https://github.com/anindhabiswas25/TaoWire"
homepage = "https://github.com/anindhabiswas25/TaoWire/tree/main/rust"
documentation = "https://docs.rs/taowire-btauth"
keywords = ["bittensor", "subnet", "btauth", "sr25519", "ed25519"]
categories = ["authentication", "cryptography"]
# The crate holds the library, its tests and examples; the fuzz crate stays in the repository.
exclude = ["fuzz/", "target/"]

[features]
default = []
axum = ["dep:axum", "dep:tower", "dep:http-body-util", "dep:tokio", "dep:futures-util"]
client = ["dep:reqwest", "dep:tokio"]
redis = ["dep:redis"]
sidecar = ["client"]

[dependencies]
schnorrkel = { version = "0.11.5", default-features = false, features = ["std", "getrandom"] }
ed25519-dalek = "2.2"
sha2 = "0.10"
blake2 = "0.10"
bs58 = "0.5"
hex = "0.4"
thiserror = "2"
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["tokio", "http1", "original-uri"] }
tower = { version = "0.5", optional = true, default-features = false }
http-body-util = { version = "0.1", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", optional = true, default-features = false, features = ["time", "sync", "rt", "macros"] }
futures-util = { version = "0.3", optional = true, default-features = false }
redis = { version = "0.32", optional = true, default-features = false, features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util", "signal"] }
tower = { version = "0.5", features = ["util"] }
futures-util = { version = "0.3", default-features = false }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "original-uri", "json"] }
# The example miner's own accept loop (header read timeout, G7-2).
hyper = { version = "1.4", features = ["server", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio", "server-graceful"] }

[[test]]
name = "conformance"
path = "tests/conformance.rs"

[[example]]
name = "textops_miner"
required-features = ["axum", "client", "sidecar", "redis"]

[[example]]
name = "interop"
required-features = ["axum", "client", "sidecar"]

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["axum", "client", "redis"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[[test]]
name = "sidecar"
path = "tests/sidecar.rs"
required-features = ["axum", "sidecar"]

[[test]]
name = "streaming"
path = "tests/streaming.rs"
required-features = ["axum", "client"]
