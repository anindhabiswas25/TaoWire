[package]
name = "taowire-btauth-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
taowire-btauth = { path = "..", features = ["sidecar"] }
serde_json = "1"

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse"
path = "fuzz_targets/sse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "trailer"
path = "fuzz_targets/trailer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sidecar"
path = "fuzz_targets/sidecar.rs"
test = false
doc = false
bench = false

[workspace]
