[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taowire"
dynamic = ["version"]
description = "ALPHA, not security-reviewed, not for mainnet value: networking kit for Bittensor v11 subnets (btauth/1 miner server, validator client) and the migration path for v10 subnets"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
keywords = ["bittensor", "subnet", "btauth", "validator", "miner", "sr25519"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: FastAPI",
  "Framework :: Pytest",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = [
  "bittensor>=11.3.0,<12",    # range, not a pin: users must be able to take SDK fixes (spec 3, 18.3)
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httptools>=0.6.3,<1",      # the miner's HTTP protocol subclasses uvicorn's httptools one (8.6.1)
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.7,<3", # 2.7+ for NoDecode (comma-separated TW_* lists); spec 8.1 says >=2.3
  "anyio>=4.4,<5",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "python-dotenv>=1.0",       # .env parsing for the unknown-TW_*-variable check
  "cryptography>=43",         # TLS: a certificate's public key for ServeAxonTls and pinning (16.3, ADR-0011)
]

[project.optional-dependencies]
redis = ["redis>=5.0,<6"]
ntp = ["ntplib>=0.4"]
migrate = ["libcst>=1.4"]               # `taowire migrate` codemods
all = ["taowire[redis,ntp,migrate]"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "respx>=0.21",
  "fakeredis>=2.23",
  "mypy>=1.10",
  "ruff>=0.5",
  "pip-audit>=2.7",
  "import-linter>=2.0",
  "numpy>=1.26",       # the ported v10 template (examples/migrations) uses it in tests
  "pyyaml>=6.0",       # tests/localnet reads examples/migrations/.../mixed-fleet.yml
]

[project.urls]
Homepage = "https://github.com/anindhabiswas25/TaoWire"
Documentation = "https://github.com/anindhabiswas25/TaoWire/tree/main/docs"
Repository = "https://github.com/anindhabiswas25/TaoWire"
Issues = "https://github.com/anindhabiswas25/TaoWire/issues"
Changelog = "https://github.com/anindhabiswas25/TaoWire/blob/main/CHANGELOG.md"
Security = "https://github.com/anindhabiswas25/TaoWire/security/policy"

[project.scripts]
taowire = "taowire.cli.main:app"

[project.entry-points.pytest11]
taowire = "taowire.testing.pytest_plugin"

[tool.hatch.version]
path = "src/taowire/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/taowire"]

# G6-1: the sdist holds exactly these (hatchling would otherwise sweep in any
# git-ignored virtualenv not named .venv, e.g. the .venv-py310 of the Python 3.10
# check). tests/unit/test_packaging.py checks the archive against this list.
[tool.hatch.build.targets.sdist]
only-include = ["src/taowire", "pyproject.toml", "README.md", "LICENSE"]
exclude = ["__pycache__", "*.py[cod]"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "S", "BLE", "A", "C4", "DTZ", "T10", "T20",
  "PIE", "PT", "RET", "SIM", "TID", "TC", "ARG", "PTH", "ERA", "PL",
  "RUF", "N", "ASYNC", "LOG", "G",
]
ignore = [
  "PLR0913",  # settings-heavy constructors are explicit by design
  "PLR2004",  # magic values are fine in range checks
  "N818",     # exception names follow spec 8.2 (AuthFailed, Forbidden, ...)
  "PLR0911",  # parsers and validators return early by design
  "TC001", "TC002", "TC003",  # annotation-only imports stay at module level (pydantic needs them)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101", "S104", "S105", "S106", "S311", "ARG001", "ARG002", "PLC0415", "PLR0915", "PLR0917",
  "PLW0108", "ARG005", "ASYNC110",
]

[tool.ruff.lint.isort]
known-first-party = ["taowire"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# ADR-0001 is enforced by import-linter (below) and tests/unit/test_architecture.py;
# these catch v10-era imports early with a pointer to the replacement.
"bittensor.core".msg = "v10 layout; v11 chain access goes through taowire.chain.gateway (ADR-0001)"
"bittensor.utils".msg = "removed in v11 (spec 3.8)"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ntplib"]   # optional extra without type information
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "localnet: needs the Docker localnet chain (just localnet-up)",
  "testnet: runs against public testnet; costs test TAO; manual only",
  "mixed_fleet: v10 + v11 fleet on localnet (just mixed-fleet)",
  "redis: needs a real Redis at TAOWIRE_TEST_REDIS_URL",
  "abuse: attacks a real miner process (spec 13.6); a few seconds each",
  "drand: calls the public drand API (spec 8.10); not in just test, keep runs short",
]

[tool.coverage.run]
source = ["taowire"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_packages = ["taowire"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ADR-0001: only chain.gateway, crypto and auth import bittensor"
type = "forbidden"
source_modules = ["taowire"]
forbidden_modules = ["bittensor", "bittensor_core"]
ignore_imports = [
  "taowire.chain.gateway -> bittensor",
  "taowire.chain.gateway -> bittensor_core",
  "taowire.crypto -> bittensor",
  "taowire.auth.** -> bittensor",
]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
name = "errors and config are leaf modules"
type = "forbidden"
source_modules = ["taowire.errors", "taowire.config"]
forbidden_modules = [
  "taowire.auth", "taowire.policy", "taowire.limits", "taowire.miner",
  "taowire.validator", "taowire.extensions", "taowire.compat", "taowire.migrate",
  "taowire.observability", "taowire.testing", "taowire.cli",
]
