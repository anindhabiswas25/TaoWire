# Mixed-fleet localnet test (spec 13.8, rollout runbook stage 0 in 10b.5).
#
# One subnet, four nodes: the archived template's v10 miner and v10 validator
# (bittensor==10.5.0, scripts/legacy_venv.sh) next to a TaoWire miner and a
# TaoWire validator. Every validator queries every miner; each cell must
# answer `requests_per_cell` template `Dummy` requests, all correct.
#
#   just localnet-up && just mixed-fleet
#
# Read by python/tests/localnet/test_mixed_fleet_localnet.py. Localnet only:
# wallets are the dev wallets scripts/localnet_up.sh creates; the chain
# rejects 127.0.0.1 as an axon IP, so miners use 127.0.0.2 / 127.0.0.3.

network: ws://127.0.0.1:9944
netuid: 2
requests_per_cell: 200
legacy_days: 30            # TW_LEGACY_V10_UNTIL / TW_LEGACY_V10_CLIENT_UNTIL = today + 30 days

nodes:
  v10_miner:
    kind: v10-axon         # scripts/v10_peer.py axon --chain ...: real v10 Axon + v10 serve_axon
    wallet: miner_go
    ip: 127.0.0.3
    port: 8093
  tw_miner:
    kind: taowire-miner # taowire Miner, Dummy on a compat.Synapse route
    wallet: miner_py
    ip: 127.0.0.2
    port: 8092
    env:
      TW_LEGACY_V10_UNTIL: legacy_days   # v10 validators still served (8.11.2)
  v10_validator:
    kind: v10-dendrite     # scripts/v10_peer.py validator: v10 metagraph + Dendrite
    wallet: owner          # needs a validator permit for the TaoWire miner
  tw_validator:
    kind: taowire-validator   # ValidatorClient, legacy client + ProtocolSelector
    wallet: validator
    env:
      TW_LEGACY_V10_CLIENT: auto
      TW_LEGACY_V10_CLIENT_UNTIL: legacy_days

cells:
  - {validator: v10_validator, miner: v10_miner, protocol: v10, note: baseline}
  - {validator: v10_validator, miner: tw_miner, protocol: v10, note: "server side, 8.11.2"}
  - {validator: tw_validator, miner: v10_miner, protocol: v10, note: "client side, 8.11.3"}
  - {validator: tw_validator, miner: tw_miner, protocol: btauth/1, verified: true}
