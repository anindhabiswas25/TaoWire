[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "text-ops-subnet"
version = "0.1.0"
description = "A Bittensor subnet built on TensorWire"
requires-python = ">=3.10,<3.15"
dependencies = ["tensorwire>=0.1.0.dev0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["text_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # pytest asserts; seeded RNGs for repeatable tasks

[tool.ruff.lint.isort]
known-first-party = ["text_ops"]

[tool.mypy]
strict = true
