# TLS at nginx in front of one TensorWire miner (spec 16.3, docs/security.md).
# Include in the http {} block (e.g. /etc/nginx/conf.d/tensorwire.conf).
#
# The miner:  TW_BIND_HOST=127.0.0.1  TW_BIND_PORT=8091
#             TW_EXTERNAL_PORT=8443   TW_TRUSTED_PROXIES=127.0.0.1/32
#             TW_TLS_PUBLISHED_CERT_FILE=/etc/tensorwire/proxy/cert.pem
# The certificate must have an Ed25519 or EC P-256 key (ADR-0011): validators
# pin its key against the one the miner publishes with ServeAxonTls.
#
# Requests are signed over the exact target and body. This config passes both
# through unchanged: `proxy_pass` has NO URI part (so nginx sends the request
# URI as the client sent it), no `rewrite`, no gzip of answers, and the body
# is forwarded as received. Do not add a URI to proxy_pass.

upstream tensorwire_miner {
    server 127.0.0.1:8091;
    keepalive 32;
}

server {
    listen 8443 ssl;
    http2 off;
    merge_slashes off;                  # keep "//" as sent (location matching too)

    ssl_certificate     /etc/tensorwire/proxy/cert.pem;
    ssl_certificate_key /etc/tensorwire/proxy/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 1m;            # >= TW_MAX_BODY_BYTES
    gzip off;

    location / {
        proxy_pass http://tensorwire_miner;     # no URI part: the target is passed unchanged
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Appends the client's address; TensorWire takes the right-most
        # address that is not in TW_TRUSTED_PROXIES.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE streams (spec 9.2): no response buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 600s;        # >= the longest TW_STREAM_MAX_S of your routes
        proxy_send_timeout 60s;
    }
}
